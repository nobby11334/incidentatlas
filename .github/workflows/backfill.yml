name: Discover and recheck public sources

on:
  push:
    branches: [main]
    paths:
      - scripts/backfill_known.py
      - scripts/discover_more.py
      - sources/**
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *" # 07:30 Asia/Tokyo; new-source discovery runs separately at 08:00

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Install primary-document parsers
        run: |
          python3 -m pip install -r requirements.txt
          if ! command -v pdftotext; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
      - name: Discover additional indexes and recheck unresolved publications
        run: python3 scripts/backfill_known.py
      - name: Validate merged data and publication safeguards
        run: |
          python3 scripts/verify_data.py
          python3 scripts/verify_october.py
          python3 scripts/verify_sources.py
          python3 scripts/verify_pages.py
          node scripts/verify_yearly.cjs
          node scripts/verify_publication.cjs
          node --check dist/app.js
      - name: Save verified additions without overwriting concurrent changes
        id: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/data.json dist/source-manifest.json dist/reconciliation.json dist/primary-evidence.json dist/search-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'Backfill identity-matched primary publications from unresolved sources'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record actual deployed source and data hashes
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          files = ['data.json', 'historical.json', 'source-manifest.json', 'review.js', 'app.js']
          manifest = {'sourceCommit': os.environ['SOURCE_COMMIT'], 'runId': os.environ['GITHUB_RUN_ID'], 'sha256': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in files}}
          (root / 'deployment.json').write_text(json.dumps(manifest, ensure_ascii=False))
          PY
      - name: Package version-consistent static release
        run: |
          python3 scripts/package_pages.py
          python3 scripts/verify_release.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload public static files only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy updated public records
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify public content against the actual data commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: python3 scripts/verify_live.py "$PAGE_URL" "$SOURCE_COMMIT"
