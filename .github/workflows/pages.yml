name: Publish Incident Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: incidentatlas-publish-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Validate data and publication safeguards
        run: |
          python3 scripts/apply_reviewed_updates.py
          python3 scripts/merge_publications.py
          python3 scripts/verify_duplicates.py
          python3 scripts/verify_data.py
          python3 scripts/verify_october.py
          python3 scripts/verify_sources.py
          python3 scripts/verify_pages.py
          node scripts/verify_yearly.cjs
          node scripts/verify_publication.cjs
          node --check dist/app.js
          node --check dist/review.js
          node --check dist/yearly.js
      - name: Save reviewed maintenance data
        id: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/data.json dist/reconciliation.json dist/source-manifest.json dist/duplicate-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply reviewed updates and canonical publication identities'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record deployed source and data hashes
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          files = ['data.json', 'historical.json', 'source-manifest.json', 'review.js', 'app.js', 'reconciliation.json', 'duplicate-audit.json']
          manifest = {
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'sha256': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in files}
          }
          (root / 'deployment.json').write_text(json.dumps(manifest, ensure_ascii=False))
          PY
      - name: Skip outdated publication when main has advanced
        id: latest
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          LATEST_SOURCE_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$LATEST_SOURCE_SHA" = "$SOURCE_COMMIT" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping an older source commit; main has advanced to $LATEST_SOURCE_SHA"
          fi
      - name: Package version-consistent static release
        if: steps.latest.outputs.publish == 'true'
        run: |
          python3 scripts/package_pages.py
          python3 scripts/verify_release.py
      - name: Configure GitHub Pages
        if: steps.latest.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload static site
        if: steps.latest.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Clear verified orphaned Pages deployment
        if: steps.latest.outputs.publish == 'true'
        env:
          PAGES_RECOVERY_TOKEN: ${{ github.token }}
        run: python3 scripts/recover_pages_deployment.py
      - name: Deploy GitHub Pages
        if: steps.latest.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify public Pages content
        if: steps.latest.outputs.publish == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: python3 scripts/verify_live.py "$PAGE_URL" "$SOURCE_COMMIT"
