name: Publish Incident Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate data and publication safeguards
        run: |
          python3 scripts/verify_data.py
          python3 scripts/verify_october.py
          python3 scripts/verify_sources.py
          python3 scripts/verify_pages.py
          node scripts/verify_yearly.cjs
          node scripts/verify_publication.cjs
          node --check dist/app.js
          node --check dist/review.js
          node --check dist/yearly.js
      - name: Record deployed source and data hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          files = ['data.json', 'historical.json', 'source-manifest.json', 'review.js', 'app.js']
          manifest = {
              'sourceCommit': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'sha256': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in files}
          }
          (root / 'deployment.json').write_text(json.dumps(manifest, ensure_ascii=False))
          PY
      - name: Skip outdated publication when main has advanced
        id: latest
        run: |
          LATEST_SOURCE_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$LATEST_SOURCE_SHA" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping an older source commit; main has advanced to $LATEST_SOURCE_SHA"
          fi
      - name: Package version-consistent static release
        if: steps.latest.outputs.publish == 'true'
        run: |
          python3 scripts/package_pages.py
          python3 scripts/verify_release.py
      - name: Configure GitHub Pages
        if: steps.latest.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload static site
        if: steps.latest.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy GitHub Pages
        if: steps.latest.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify public Pages content
        if: steps.latest.outputs.publish == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify_live.py "$PAGE_URL" "$GITHUB_SHA"
